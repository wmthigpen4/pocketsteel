<!doctype html>
<html lang="en" data-presentation="full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Howdy Solo Companion | Travis Toy Tutorials</title>
  <link rel="stylesheet" href="{{STYLE_URL}}">
</head>
<body>
  <a class="skip-link" href="#companion">Skip to companion</a>
  <header class="partner-hero">
    {{HERO_IMAGE}}
    <div class="partner-wordmark" aria-label="Travis Toy Tutorials">
      <span>TRAVIS TOY</span>
      <strong>TUTORIALS</strong>
    </div>
    <div class="hero-steel" aria-hidden="true">
      <span class="steel-neck"></span><span class="steel-body"></span><span class="steel-leg steel-leg-one"></span><span class="steel-leg steel-leg-two"></span>
    </div>
    <div class="hero-copy">
      <p class="eyebrow">Lesson companion</p>
      <h1>“Howdy” Solo</h1>
      <p>Loop the eight-bar solo, slow it down, and play it over the complete backing track.</p>
    </div>
  </header>
  <main id="companion" class="companion-shell full-shell" data-companion-url="{{COMPANION_URL}}" data-pdf-url="{{PDF_URL}}">
    {{COMPANION_MARKUP}}
  </main>
  <footer class="partner-footer">
    <p>Travis Toy Tutorials lesson companion</p>
    <p>Powered by Steel Guitar RAG</p>
  </footer>
  <script src="{{SCRIPT_URL}}" defer></script>
</body>
</html>
