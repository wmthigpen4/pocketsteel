<!doctype html>
<html lang="en" data-presentation="embed-demo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Teachable-style Howdy Companion Demo</title>
  <link rel="stylesheet" href="{{STYLE_URL}}">
</head>
<body class="embed-demo-body">
  <a class="skip-link" href="#companion">Skip to companion</a>
  <header class="demo-header">
    <div class="demo-school-name">TRAVIS TOY TUTORIALS</div>
    <span class="demo-label">Lesson companion preview</span>
  </header>
  <main class="lesson-frame">
    <section class="lesson-context" aria-labelledby="demo-lesson-title">
      <p class="lesson-breadcrumb">Travis Toy Tutorials</p>
      <h1 id="demo-lesson-title">“Howdy” Solo (Eddy Dunlap)</h1>
      <div class="video-simulation">
        <div class="video-play" aria-hidden="true">▶</div>
        <p>Lesson video</p>
      </div>
    </section>
    <section id="companion" class="companion-shell compact-shell" data-companion-url="{{COMPANION_URL}}" data-pdf-url="{{PDF_URL}}">
      {{COMPANION_MARKUP}}
    </section>
    <section class="demo-discussion" data-demo-discussion aria-labelledby="demo-discussion-title">
      <div class="demo-discussion-label" id="demo-discussion-title">Discussion</div>
      <div class="demo-discussion-content">
        <h2>Post a comment</h2>
        <div class="demo-comment-layout">
          <div class="demo-comment-avatar" aria-hidden="true">M</div>
          <div class="demo-comment-composer">
            <textarea aria-label="Comment box preview" placeholder="Leave a comment..." disabled></textarea>
            <div class="demo-comment-actions" aria-hidden="true">
              <span>Add Image</span>
              <button type="button" disabled>Post Comment</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="{{SCRIPT_URL}}" defer></script>
</body>
</html>
