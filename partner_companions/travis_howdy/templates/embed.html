<!doctype html>
<html lang="en" data-presentation="embed-demo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Teachable-style Howdy Companion Demo</title>
  <link rel="stylesheet" href="{{STYLE_URL}}">
</head>
<body class="embed-demo-body">
  <a class="skip-link" href="#companion">Skip to companion</a>
  <header class="demo-header">
    <div class="demo-school-name">TRAVIS TOY TUTORIALS</div>
    <span class="demo-label">Embed layout preview - not hosted by Teachable</span>
  </header>
  <main class="lesson-frame">
    <section class="lesson-context" aria-labelledby="demo-lesson-title">
      <p class="lesson-breadcrumb">Travis Toy Tutorials / Lesson preview</p>
      <h1 id="demo-lesson-title">“Howdy” Solo (Eddy Dunlap)</h1>
      <div class="video-simulation">
        <div class="video-play" aria-hidden="true">▶</div>
        <p>Existing lesson video area</p>
        <span>This demo does not reproduce or control the Teachable player.</span>
      </div>
    </section>
    <section id="companion" class="companion-shell compact-shell" data-companion-url="{{COMPANION_URL}}" data-pdf-url="{{PDF_URL}}">
      {{COMPANION_MARKUP}}
    </section>
  </main>
  <script src="{{SCRIPT_URL}}" defer></script>
</body>
</html>
