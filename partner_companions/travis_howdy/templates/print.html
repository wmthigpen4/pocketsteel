<!doctype html>
<html lang="en" data-presentation="print">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Howdy Solo Printable Tablature</title>
  <link rel="stylesheet" href="{{STYLE_URL}}">
</head>
<body class="print-page-body">
  <header class="print-toolbar no-print">
    <a class="quiet-link" href="/howdy">← Back to companion</a>
    <div class="print-toolbar-actions">
      <button type="button" class="button button-secondary" data-action="browser-print">Print this view</button>
      <a class="button button-primary" href="{{PDF_URL}}" data-pdf-link>Open PDF</a>
    </div>
  </header>
  <main id="companion" class="print-sheet" data-companion-url="{{COMPANION_URL}}" data-pdf-url="{{PDF_URL}}">
    <div class="print-loading">Preparing the canonical tablature…</div>
  </main>
  <script src="{{SCRIPT_URL}}" defer></script>
</body>
</html>
