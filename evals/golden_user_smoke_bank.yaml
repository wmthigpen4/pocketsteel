version: 1
description: Adversarial must-pass user smoke bank for answer quality. SGF/forum evidence may support source-backed answers,
  but must not become primary answer text unless the user explicitly asks for forum quotes.
global_rules:
  allow_sgf_answer_body_default: false
  sgf_forum_text_rule: SGF/forum text must never appear directly in the answer body unless the user explicitly asks for forum
    quotes.
  forbidden_answer_body_patterns: &id001
  - I found this in limited source support
  - treat it as a clue rather than consensus
  - Can someone please tell me
  - I know when I first started
  - lolol Thank God
  - you desire more information
  - have a couple of students
  - beyond simply facilitating
  - Further he went on to state
  - You can also build a 7 string instrument
  - It seems that playing steel guitar has a lot in common
  - deterministic map
  - rules engine
  - payload
  - classifier
  - contract
  - retrieved material
  - source cards
  - source support was weak
  report_gates:
  - SGF leakage
  - direct answer first
  - intent recognition
  - fretboard expected/present
  - source-card appropriateness
  - off-domain guardrail
  - web-required handling
  - internal wording leakage
mutation_rules:
- filler words
- profanity/frustration
- look like
- where can I find
- what frets give me
- sharp/flat spellings
- abbreviations
- punctuation/casing variations
