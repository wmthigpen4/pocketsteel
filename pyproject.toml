[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketsteel"
version = "0.1.0"
description = "Local source-grounded RAG over Steel Guitar Forum data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
rag = [
  "sentence-transformers>=3.0",
]
test = [
  "pytest>=8.0",
]

[tool.setuptools]
packages = ["pocketsteel"]

