[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketsteel"
version = "0.1.0"
description = "Local source-grounded RAG over Steel Guitar Forum data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyJWT[crypto]>=2.13,<3",
]

[project.optional-dependencies]
rag = [
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "streamlit>=1.34",
]
test = [
  "chromadb>=0.5",
  "mypy>=2.3,<3",
  "pip-audit>=2.10,<3",
  "pytest>=9,<10",
  "PyYAML>=6,<7",
  "ruff>=0.15,<0.16",
]
deployment = [
  "build>=1.5,<2",
]

[tool.setuptools]
packages = ["pocketsteel"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
